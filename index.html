<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panora — PEA screener for Euronext</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAECF0; --card:#FFFFFF; --ink:#12181F; --muted:#6C7683;
  --line:#D3D8DF; --line-soft:#E6E9ED;
  --up:#0B6E4F; --down:#A63A2A; --warn:#B7791F;
  /* one colour per score block, reused everywhere that block appears */
  --trend:#2E3AA8;   --trend-soft:#E6E8F7;
  --quality:#0E7C7B; --quality-soft:#E0F1F0;
  --growth:#B26A00;  --growth-soft:#FBEEDC;
  --value:#6D3FA0;   --value-soft:#EFE7F7;
  --r:4px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Inter Tight",system-ui,sans-serif; font-size:14px; line-height:1.45;
}
.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
.wrap{max-width:1340px; margin:0 auto; padding:22px 18px 80px;}

/* ---------- header + funnel (signature element) ---------- */
header{margin-bottom:22px}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted);
}
h1{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:700;
  font-size:clamp(28px,5vw,46px); line-height:1; letter-spacing:-.02em; margin:6px 0 4px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
h1 .tag{
  font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:12px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--trend);
  border:1px solid var(--trend); border-radius:20px; padding:3px 10px;
}
.sub{color:var(--muted); max-width:62ch; margin:0 0 20px}
.funnel{display:flex; flex-wrap:wrap; gap:2px; border:1px solid var(--line); background:var(--card); border-radius:var(--r); overflow:hidden}
.stage{
  padding:11px 14px 14px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
  flex:1 1 0; min-width:96px; cursor:help; position:relative; overflow:hidden;
}
.stage:last-child{border-right:0}
.stage b{font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:600; display:block; line-height:1.1; white-space:nowrap}
.stage span{font-size:11px; color:var(--muted); letter-spacing:.02em; display:block; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stage i{position:absolute; left:0; bottom:0; height:3px; background:var(--line-soft); display:block}
.stage i em{position:absolute; inset:0 auto 0 0; display:block; background:var(--trend)}
/* funnel narrows in colour as well as fill-bar length: pale at the wide end, saturated at the nugget end */
.stage.s0{background:#F4F5F8} .stage.s1{background:#EDEFF7}
.stage.s2{background:var(--trend-soft)} .stage.s3{background:var(--quality-soft)}
.stage.s4{background:#FDF3D8; box-shadow:inset 3px 0 0 var(--growth)}
.stage.s4 b{color:#8A5200}
.stage.s4 i em{background:var(--growth)}
.stamp{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); margin-top:8px}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; margin:20px 0 0; border-bottom:1px solid var(--line)}
.tab{
  font:inherit; font-weight:500; background:none; border:none; cursor:pointer;
  padding:9px 4px; margin-right:18px; color:var(--muted); border-bottom:2px solid transparent;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--trend); border-bottom-color:var(--trend)}

/* ---------- methodology page ---------- */
.meth{max-width:760px; padding:26px 0 10px}
.meth h2{font-family:"Bricolage Grotesque",sans-serif; font-size:21px; margin:30px 0 4px; letter-spacing:-.01em}
.meth h2:first-child{margin-top:4px}
.meth h2 .ico{margin-right:8px}
.meth p{color:#37414D; margin:8px 0}
.meth p.lede{color:var(--ink); font-size:15px}
.meth ul{margin:8px 0; padding-left:20px} .meth li{margin:4px 0; color:#37414D}
.meth .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; margin:12px 0}
.meth .card{border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; background:var(--card)}
.meth .card b{display:block; font-size:13px; margin-bottom:2px}
.meth .card span{font-size:12px; color:var(--muted)}
.meth .card.t{border-left:3px solid var(--trend)} .meth .card.q{border-left:3px solid var(--quality)}
.meth .card.g{border-left:3px solid var(--growth)} .meth .card.v{border-left:3px solid var(--value)}
.meth table{border-collapse:collapse; width:100%; margin:10px 0; font-size:13px}
.meth table th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); padding:6px 10px; border-bottom:1px solid var(--line)}
.meth table td{padding:6px 10px; border-bottom:1px solid var(--line-soft)}
.meth table td.num{font-family:"IBM Plex Mono",monospace}
.meth .note{
  background:var(--trend-soft); border:1px solid #C7CCED; color:#1F2A6E;
  padding:10px 13px; border-radius:var(--r); font-size:13px; margin:14px 0;
}
.meth .warn-box{
  background:#FDF3D8; border:1px solid #E9CE8E; color:#6E4E00;
  padding:10px 13px; border-radius:var(--r); font-size:13px; margin:14px 0;
}

/* ---------- filters ---------- */
.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:22px 0 12px}
select,button,input[type=search]{
  font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:7px 10px; cursor:pointer;
}
input[type=search]{cursor:text; min-width:150px}
button:hover,select:hover{border-color:var(--trend)}
button.on{background:var(--trend); border-color:var(--trend); color:#fff}
.spacer{flex:1}
.count{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted)}

/* ---------- table ---------- */
.tablewrap{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:960px}
th,td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--line-soft); white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
thead th{
  position:sticky; top:0; background:var(--card); z-index:2; cursor:pointer;
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); font-weight:500; border-bottom:2px solid var(--line);
}
thead th:hover{color:var(--trend)}
thead th[aria-sort]:after{content:" ▾"; color:var(--trend)}
thead th[aria-sort=asc]:after{content:" ▴"}
/* column headers tinted by which score block they feed */
thead th.c-trend{color:var(--trend)} thead th.c-quality{color:var(--quality)}
thead th.c-growth{color:var(--growth)} thead th.c-value{color:var(--value)}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F5F6F9}
tbody tr.out{opacity:.4}
.tk{font-family:"IBM Plex Mono",monospace; font-weight:600}
.nm{color:var(--muted); font-size:12px; display:block}
.up{color:var(--up)} .down{color:var(--down)}
.mk{font-size:11px; color:var(--muted)}
.score{font-family:"IBM Plex Mono",monospace; font-weight:600; padding:2px 7px; border-radius:10px}
.score.hi{background:#E3F3EC; color:var(--up)}
.score.mid{background:#FBEEDC; color:#8A5200}
.score.lo{background:#F1F2F5; color:var(--muted)}
.pill{
  font-family:"IBM Plex Mono",monospace; font-size:10px; padding:3px 7px;
  border-radius:3px; border:1px solid var(--line); color:var(--muted); cursor:help;
}
.pill.ok{color:var(--up); border-color:#A9D2C2; background:#EAF6F1}
.pill.no{color:var(--down); border-color:#E6BDB3; background:#FBEFEC}

/* weighted score bar: segment widths ARE the 40/25/20/15 weights */
.bar{display:flex; width:120px; height:18px; gap:1px; margin-left:auto; cursor:help}
.seg{position:relative; background:var(--line-soft); border-radius:1px}
.seg i{position:absolute; inset:auto 0 0 0; display:block; border-radius:1px}
.seg.t{flex:40} .seg.t i{background:var(--trend)}
.seg.q{flex:25} .seg.q i{background:var(--quality)}
.seg.g{flex:20} .seg.g i{background:var(--growth)}
.seg.v{flex:15} .seg.v i{background:var(--value)}

/* ---------- tooltip ---------- */
.ttip{border-bottom:1px dotted currentColor; cursor:help}
#tip{
  position:fixed; z-index:60; max-width:290px; background:var(--ink); color:#F3F5F8;
  padding:9px 11px; border-radius:5px; font-size:12.5px; line-height:1.4;
  box-shadow:0 6px 24px rgba(18,24,31,.24); pointer-events:none; opacity:0;
  transition:opacity .12s; font-family:"Inter Tight",sans-serif;
}
#tip.show{opacity:1}
#tip b{color:#FFF; display:block; margin-bottom:3px; font-size:12px}
#tip em{display:block; margin-top:5px; color:#9FC7B5; font-style:normal;
  font-family:"IBM Plex Mono",monospace; font-size:11px}

/* ---------- detail drawer ---------- */
.drawer{
  position:fixed; inset:0 0 0 auto; width:min(470px,100%); background:var(--card);
  border-left:1px solid var(--line); padding:22px; overflow-y:auto;
  transform:translateX(100%); transition:transform .22s ease; z-index:10;
  box-shadow:-14px 0 40px rgba(18,24,31,.1);
}
.drawer.open{transform:none}
.drawer h2{font-family:"Bricolage Grotesque",sans-serif; font-size:24px; margin:0 0 2px; letter-spacing:-.01em}
.close{position:absolute; top:16px; right:16px}
.kv{display:grid; grid-template-columns:1fr auto; gap:5px 12px; margin:14px 0; font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0; font-family:"IBM Plex Mono",monospace; text-align:right}
.grp{
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:6px 10px; margin-top:18px; border-radius:3px; display:flex; justify-content:space-between;
}
.grp.t{background:var(--trend-soft); color:var(--trend)}
.grp.q{background:var(--quality-soft); color:var(--quality)}
.grp.g{background:var(--growth-soft); color:var(--growth)}
.grp.v{background:var(--value-soft); color:var(--value)}
.reason{background:#FBEFEC; border:1px solid #E6BDB3; color:var(--down); padding:8px 10px; border-radius:var(--r); font-size:12px; margin-top:12px}
.pills{margin-top:14px; display:flex; gap:6px; flex-wrap:wrap}
.pillhead{font-size:11px; color:var(--muted); margin-top:16px}
details#settings{margin-top:10px}
details#settings summary{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--trend);cursor:pointer}
#settingsBody{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px;margin-top:10px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:12px}
#settingsBody div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-soft);padding:3px 0}
#settingsBody b{font-family:"IBM Plex Mono",monospace;font-weight:500}
.empty{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:28px; text-align:center; color:var(--muted)}
.empty code{font-family:"IBM Plex Mono",monospace; background:var(--paper); padding:2px 5px}
@media (prefers-reduced-motion:reduce){.drawer,#tip{transition:none}}
@media (max-width:640px){.stage{flex:1 1 45%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Euronext Paris · Amsterdam · Brussels · Lisbon — PEA-eligible</div>
    <h1>Panora<span class="tag">PEA screener</span></h1>
    <p class="sub">Pan the whole river, keep what glints. Long-term trend first (200-day moving average as a hard filter), fundamentals next. Hover any metric for a plain-English definition.</p>
    <div class="funnel" id="funnel"></div>
    <div class="stamp" id="stamp">Loading…</div>
    <details id="settings"><summary>Settings applied to this run</summary><div id="settingsBody"></div></details>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabScreener">📊 Screener</button>
    <button class="tab" id="tabMethod">📖 Methodology</button>
  </div>

  <div id="viewScreener">
  <div class="controls">
    <select id="market"><option value="">🌍 All markets</option></select>
    <select id="sector"><option value="">🏭 All sectors</option></select>
    <input type="search" id="q" placeholder="🔍 Search">
    <button id="fOut" class="on">Hide excluded</button>
    <button id="fHalf">💎 Half-Price 5Y</button>
    <button id="fTop">⭐ Score ≥ 3.8</button>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
    <button id="brief">📋 Copy research brief</button>
    <button id="csv">⬇ Export CSV</button>
  </div>

  <div class="tablewrap"><table id="tbl">
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table></div>
  <div id="empty"></div>
  </div>

  <div id="viewMethod" class="meth" style="display:none"></div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="tip" role="tooltip"></div>

<script>
/* ============================================================
   GLOSSARY — plain-English definition for every metric shown.
   `rule` is the rule of thumb printed in green under the text.
   ============================================================ */
const G={
 price:{t:"Price",d:"Latest closing price."},
 market:{t:"Market",d:"Which Euronext exchange the share is listed on."},
 sector:{t:"Sector",d:"Business sector, used to compare like with like and to exempt some sectors from the debt filter."},
 perf_52w:{t:"52-week performance",d:"How much the share price moved over the last year. The raw trend, before comparing to anything else."},
 rel_strength_52w:{t:"Relative strength",d:"The share's 52-week performance minus the benchmark index's. This is the honest version of performance: it tells you whether the company outran the market or just floated up with it.",rule:"Positive = beating the index"},
 dist_high_52w:{t:"Distance from 52-week high",d:"How far below its 12-month peak the share sits today. Close to 0% means it is trading at its highs, which in trend-following is a strength, not a warning."},
 roe:{t:"ROE — return on equity",d:"Profit generated for every euro of shareholder money. It answers: how well does this company compound the capital its owners left in it?",rule:"Above 15% = strong"},
 roce:{t:"ROCE — return on capital employed",d:"Profit for every euro of ALL capital used, equity plus debt. Harder to flatter than ROE, because loading up on debt doesn't improve it. The cleanest read on whether management uses capital well.",rule:"Above 15% = quality"},
 ev_ebitda:{t:"EV/EBITDA",d:"How many years of operating profit it would take to pay for the entire company, debt included. Below 10 you're usually in boring, unglamorous businesses — which is often exactly where the value hides.",rule:"Below 10 = inexpensive"},
 fcf_yield:{t:"Free cash flow yield",d:"The cash the business actually generates, divided by its market value. What you'd collect each year if the company handed everything to shareholders. Cash is harder to massage than accounting profit."},
 cagr_implied_5y:{t:"Implied 5-year return",d:"The annual return you'd get if the 5-year projection plays out, buying at today's price. This is the output of the Half-Price 5Y gate.",rule:"Target 15%/yr"},
 pe:{t:"P/E — price to earnings",d:"Share price divided by earnings per share: how many years of current profit you pay for one share. Useful, but says nothing about growth on its own — that's what PEG is for."},
 peg:{t:"PEG — price/earnings to growth",d:"P/E divided by the earnings growth rate. It answers the question P/E can't: is the price high because the company is genuinely growing, or just expensive? At or below 1, the price is not stretched relative to the growth you're buying.",rule:"1 or below = fairly priced for its growth"},
 eps_growth_3y:{t:"EPS growth",d:"Earnings PER SHARE growth per year. The 'per share' matters: a company can grow total profit while issuing so many new shares that your slice shrinks. This metric catches that.",rule:"Above 5% = profits really growing"},
 rev_growth_3y:{t:"Revenue growth",d:"Annual sales growth over three years. The top line — it shows demand, but says nothing about whether that growth is profitable."},
 net_margin:{t:"Net margin",d:"What share of every euro of sales survives to the bottom line as profit. High and stable margins usually signal pricing power."},
 ma200:{t:"200-day moving average",d:"The average closing price over the last 200 trading days. When the price sits ABOVE it, the stock is in a long-term uptrend. This is the hard filter: names below it for more than six months are excluded outright, however good their fundamentals look.",rule:"Price above MA200 = uptrend"},
 ma50:{t:"50-day moving average",d:"Same idea over 50 days: the medium-term trend. Price above both MA50 and MA200 is the strongest configuration."},
 ma200_slope_6m:{t:"MA200 slope",d:"Whether the 200-day average itself has risen over the last six months. The price can poke above a still-falling average — a rising average confirms the trend is real."},
 rsi_weekly:{t:"Weekly RSI",d:"Momentum gauge from 0 to 100. Above 70 the stock is overbought and may have run too far too fast; below 30 it is oversold. Context, not a signal on its own."},
 net_debt_ebitda:{t:"Net debt / EBITDA",d:"How many years of operating profit it would take to clear the debt. The single most useful solvency number.",rule:"Below 2x = comfortable"},
 net_debt_net_income:{t:"Net debt / net income",d:"Same question measured against bottom-line profit, which is stricter than EBITDA because it counts interest, tax and depreciation."},
 current_ratio:{t:"Current ratio",d:"Short-term assets divided by short-term debts. Below 1 means the company may struggle to cover the coming year's bills without new financing."},
 insider_pct:{t:"Insider ownership",d:"Share of the company held by its own executives and directors. When management owns a meaningful stake, their money moves with yours.",rule:"Above 3% = skin in the game"},
 dividend_yield:{t:"Dividend yield",d:"Annual dividend as a percentage of the share price."},
 market_cap:{t:"Market capitalisation",d:"Total value of all shares. Small caps are where inefficiencies live, but also where data is thinnest and trading costs highest."},
 turnover_median:{t:"Median daily turnover",d:"Euros traded per day, typical value. Low turnover means wide spreads and difficulty exiting a position — an execution-cost issue, not a judgement on the company.",rule:"Below €100k/day = hard to trade"},
 half_price:{t:"Half-Price 5Y gate",d:"Projects earnings per share five years out using capped growth and a capped exit P/E, then works backwards to the return implied by today's price. Deliberately conservative so a temporary growth spurt can't make a stock look artificially cheap.",rule:"Passes at 15%/yr or better"},
 score:{t:"Overall score",d:"Weighted blend of the four blocks, each scored 1 to 5: trend 40%, quality 25%, growth 20%, value 15%. Trend dominates by design — a great business in a downtrend still gets marked down."},
 bar:{t:"Score breakdown",d:"Four bars whose WIDTHS are the weights (trend 40%, quality 25%, growth 20%, value 15%) and whose FILL HEIGHT is that block's 1-to-5 score. A wide bar barely filled is a weak trend, which matters most."},
 funnel_universe:{t:"Stocks panned",d:"Every listed company screened this run: all PEA-eligible shares on Euronext Paris, Amsterdam, Brussels and Lisbon. This is the raw sand going into the pan."},
 funnel_data:{t:"With usable data",d:"Names for which enough price history and financials came back to be scored. The rest are listed as errors in data.json."},
 funnel_trend:{t:"Passed the trend filter",d:"Names still in a long-term uptrend and liquid enough to trade. Most of the universe drops out here — that is the 200-day moving average doing its job."},
 funnel_filters:{t:"Survived the hard filters",d:"Names that also cleared the fundamental knockouts: positive profit, positive free cash flow, tolerable debt, no revenue collapse."},
 funnel_shortlist:{t:"Nuggets",d:"The high scorers worth opening a report on. This is where the screener stops and your own research starts."},
};

/* ---------- tooltip engine (hover on desktop, tap on touch) ---------- */
const tipEl=document.getElementById("tip");
function showTip(el){
  const k=el.dataset.g, g=G[k]; if(!g) return;
  tipEl.innerHTML=`<b>${g.t}</b>${g.d}${g.rule?`<em>▸ ${g.rule}</em>`:""}`;
  tipEl.classList.add("show");
  const r=el.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  let x=Math.min(r.left, innerWidth-t.width-12), y=r.bottom+8;
  if(y+t.height>innerHeight-8) y=r.top-t.height-8;
  tipEl.style.left=Math.max(8,x)+"px"; tipEl.style.top=Math.max(8,y)+"px";
}
const hideTip=()=>tipEl.classList.remove("show");
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-g]"); el?showTip(el):hideTip()});
document.addEventListener("click",e=>{const el=e.target.closest("[data-g]"); if(el){e.stopPropagation();showTip(el)}else hideTip()});
document.addEventListener("scroll",hideTip,true);

 {k:"price",   label:"Price",        g:"price"},
 {k:"perf_52w",label:"52w perf",     g:"perf_52w",         c:"c-trend"},
 {k:"rel_strength_52w",label:"Rel. strength",g:"rel_strength_52w",c:"c-trend"},
 {k:"dist_high_52w",label:"vs 52w high",g:"dist_high_52w", c:"c-trend"},
 {k:"roe",     label:"ROE",          g:"roe",              c:"c-quality"},
 {k:"roce",    label:"ROCE",         g:"roce",             c:"c-quality"},
 {k:"eps_growth_3y",label:"EPS growth",g:"eps_growth_3y",  c:"c-growth"},
 {k:"ev_ebitda",label:"EV/EBITDA",   g:"ev_ebitda",        c:"c-value"},
 {k:"peg",     label:"PEG",          g:"peg",              c:"c-value"},
 {k:"fcf_yield",label:"FCF yield",   g:"fcf_yield",        c:"c-value"},
 {k:"cagr_implied_5y",label:"5y CAGR",g:"cagr_implied_5y", c:"c-value"},
 {k:"score",   label:"Score",        g:"score"},
];

function demoFallback(){
  if(window.DEMO_DATA){
    init(window.DEMO_DATA);
    document.getElementById("stamp").insertAdjacentHTML("beforeend",
      ' — <b style="color:var(--warn)">⚠ demo data, made-up numbers</b>');
    return;
  }
  document.getElementById("stamp").textContent="";
  document.getElementById("empty").innerHTML=
    `<div class="empty"><p><b>No data to display.</b></p>
     <p>Run <code>python screener.py</code> to generate <code>data.json</code> next to this page,
     or wait for the next scheduled GitHub Action run.</p></div>`;
  document.querySelector(".tablewrap").style.display="none";
}

if(location.protocol==="file:"){
  demoFallback();           // fetch() is blocked on file:// by the browser (CORS)
} else {
  fetch("data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(init)
   .catch(()=>fetch("data.demo.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
     init(d);
     document.getElementById("stamp").insertAdjacentHTML("beforeend",
       ' — <b style="color:var(--warn)">⚠ demo data, made-up numbers</b>');
   }))
   .catch(demoFallback);
}

function init(d){
  DATA=d; rows=d.rows; CFG=d.config||{};
  TARGET_CAGR=CFG.half_price_5y_valuation?.target_cagr ?? 0.15;
  THR=CFG.display_thresholds||{};
  SHORTLIST_SCORE=THR.shortlist_score ?? 3.8;
  document.getElementById("fTop").textContent="⭐ Score ≥ "+SHORTLIST_SCORE.toFixed(1);

  document.getElementById("head").innerHTML=
    COLS.map(c=>`<th data-k="${c.k}" class="${c.c||""}" ${c.g?g(c.g):""}>${c.label}</th>`).join("")
    + `<th ${g("bar")}>T · Q · G · V</th>`;

  settingsPanel();
  const f=d.funnel;
  const stages=[
    ["🪣","Listed stocks panned",f.universe,"funnel_universe"],
    ["📄","With usable data",f.data_ok,"funnel_data"],
    ["📈","Passed trend filter",f.trend_ok??f.data_ok,"funnel_trend"],
    ["🧪","Survived hard filters",f.after_filters,"funnel_filters"],
    ["💎","Nuggets",f.shortlist,"funnel_shortlist"],
  ];
  const maxV=Math.max(...stages.map(s=>s[2]),1);
  document.getElementById("funnel").innerHTML=stages.map(([emo,l,v,gk],i)=>{
    const w=Math.max(v/maxV*100,3); // floor so even a tiny shortlist still shows a sliver
    return `<div class="stage s${i}" ${g(gk)}>
      <b>${v}</b><span>${emo} ${l}</span><i><em style="width:${w}%"></em></i></div>`;
  }).join("");

  document.getElementById("stamp").textContent=
    "Data as of "+new Date(d.generated_at).toLocaleString("en-US")+" · benchmark "+
    (d.config?.execution?.benchmark??"—")+
    (d.errors.length?` · ${d.errors.length} name(s) without data`:"");
  fill("market","market"); fill("sector","sector");
  render();
  renderMethodology();
}

function settingsPanel(){
  const P=CFG.score_weights||{}, F=CFG.elimination_filters||{}, Un=CFG.universe||{};
  const L=[["Trend weight",pct(P.trend,0)],["Quality weight",pct(P.quality,0)],
   ["Growth weight",pct(P.growth,0)],["Value weight",pct(P.value,0)],
   ["Half-Price 5Y target",pct(TARGET_CAGR,0)],["Shortlist threshold",SHORTLIST_SCORE],
   ["Max days below MA200",F.max_days_below_ma200],
   ["Max net debt/EBITDA",F.max_net_debt_to_ebitda!=null?F.max_net_debt_to_ebitda+"x":null],
   ["Min current ratio",F.min_current_ratio],
   ["Min market cap",Un.min_market_cap_eur!=null?cap(Un.min_market_cap_eur):null],
   ["Min daily liquidity",Un.min_daily_turnover_eur!=null?cap(Un.min_daily_turnover_eur):null],
   ["Elimination filters",CFG.elimination_filters?(F.enabled?"on":"off"):null]];
  const present=L.filter(([,v])=>v!=null&&v!=="—");
  document.getElementById("settingsBody").innerHTML = present.length
    ? present.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("")
    : `<div style="grid-column:1/-1;color:var(--muted)">This dataset doesn't include configuration details (older format).</div>`;
}

function renderMethodology(){
  const Un=CFG.universe||{}, F=CFG.elimination_filters||{}, W=CFG.score_weights||{},
        GT=CFG.trend_grid||{}, GQ=CFG.quality_grid||{}, GG=CFG.growth_grid||{}, GV=CFG.value_grid||{},
        HP=CFG.half_price_5y_valuation||{}, T=CFG.display_thresholds||{};
  const declineFloor = F.min_revenue_growth_3y!=null ? pct(Math.abs(F.min_revenue_growth_3y),0) : "—";

  document.getElementById("viewMethod").innerHTML = `
    <p class="lede">How Panora screens, scores, and refreshes — every number below is read live from this run's own configuration, not typed in separately, so it can't drift out of sync with what the screener actually did.</p>

    <h2><span class="ico">🧭</span>Scope</h2>
    <p>Panora screens common stocks on four Euronext venues — Paris, Amsterdam, Brussels, and Lisbon — and keeps only names eligible for the French PEA tax wrapper. Eligibility is inferred from the issuer's country (via ISIN when available, otherwise the listing venue), checked against the EU/EEA country list in the screener's configuration.</p>
    <div class="grid">
      <div class="card"><b>${cap(Un.min_market_cap_eur)}</b><span>Minimum market cap</span></div>
      <div class="card"><b>${cap(Un.min_daily_turnover_eur)}</b><span>Minimum daily liquidity</span></div>
      <div class="card"><b>~500-600</b><span>Names with usable price data</span></div>
      <div class="card"><b>4</b><span>Euronext venues covered</span></div>
    </div>
    <p>Below the market-cap floor, a position of a few thousand euros is often too large relative to free float. Below the liquidity floor, spreads eat into returns and exits get difficult — this is a trading-cost filter, not a judgement on the company.</p>

    <h2><span class="ico">🚫</span>What gets excluded outright</h2>
    <p>Before any score is computed, a name is dropped to the shortlist's "excluded" state — still visible in the table, with its reason shown — if it trips <b>any one</b> of these. A statistically cheap stock can still be excluded if the trend or balance sheet says otherwise; nothing here is a judgement call, it's a fixed rule applied the same way to every name.</p>
    <table>
      <thead><tr><th>Rule</th><th>Current threshold</th></tr></thead>
      <tbody>
        <tr><td>Price below its 200-day moving average</td><td class="num">${F.max_days_below_ma200 ?? "—"} sessions</td></tr>
        <tr><td>Net income</td><td class="num">${F.net_income_must_be_positive ? "must be positive" : "not enforced"}</td></tr>
        <tr><td>Free cash flow</td><td class="num">${F.fcf_must_be_positive ? "must be positive" : "not enforced"}</td></tr>
        <tr><td>Net debt / EBITDA above</td><td class="num">${F.max_net_debt_to_ebitda ?? "—"}×</td></tr>
        <tr><td>Current ratio below</td><td class="num">${F.min_current_ratio ?? "—"}</td></tr>
        <tr><td>Revenue decline over 3 years, worse than</td><td class="num">${declineFloor}</td></tr>
      </tbody>
    </table>
    <p>Exempt from the debt/current-ratio checks: ${(F.sectors_exempt_from_debt_filter||[]).join(", ") || "none"} — sectors where balance-sheet structure differs by nature of the business.</p>

    <h2><span class="ico">🧮</span>How the score is built</h2>
    <p>Every surviving name gets four sub-scores, each 1 to 5, blended into one overall score:</p>
    <div class="grid">
      <div class="card t"><b>Trend — ${pct(W.trend,0)}</b><span>Price above its 50- and 200-day averages, the average itself rising, strong 52-week performance, beating the benchmark.</span></div>
      <div class="card q"><b>Quality — ${pct(W.quality,0)}</b><span>ROE above ${pct(GQ.excellent_roe,0)} with low debt scores highest; ROE is the anchor metric.</span></div>
      <div class="card g"><b>Growth — ${pct(W.growth,0)}</b><span>3-year revenue growth above ${pct(GG.great_revenue_growth,0)} scores highest.</span></div>
      <div class="card v"><b>Value — ${pct(W.value,0)}</b><span>P/E below ${GV.excellent_pe} with FCF yield above ${pct(GV.excellent_fcf_yield,0)} and EV/EBITDA below ${GV.excellent_ev_ebitda} scores highest.</span></div>
    </div>
    <p>Trend carries the heaviest weight on purpose: a great business already in a downtrend still scores low here. Overall score = trend×${W.trend??"—"} + quality×${W.quality??"—"} + growth×${W.growth??"—"} + value×${W.value??"—"}, each sub-score on its own 1-5 scale. Names scoring <b>${T.shortlist_score??"—"}</b> or above make the "Nuggets" shortlist.</p>

    <h2><span class="ico">💰</span>The Half-Price 5Y gate</h2>
    <p>A separate, more conservative check, shown per name in its detail panel. Earnings per share are projected five years out using capped growth (max ${pct(HP.eps_growth_cap,0)}/yr) and a capped exit P/E (max ${HP.exit_pe_cap ?? "—"}×), then the annual return implied by buying at today's price is computed. It passes at <b>${pct(HP.target_cagr,0)}/yr</b> or better. The caps exist so a temporary growth spurt can't make a stock look artificially cheap.</p>

    <h2><span class="ico">📡</span>Data &amp; refresh</h2>
    <p>Prices and fundamentals come from Yahoo Finance via the <code>yfinance</code> library — free, but an unofficial API: fundamentals can lag a quarter and are sometimes missing for micro caps, in which case they're flagged as unavailable rather than guessed at. To keep runs fast across hundreds of names, trend data is pulled for the whole universe first; fundamentals are only downloaded for names that already pass the trend filter.</p>
    <div class="note">The screener re-runs automatically <b>Tuesday through Saturday</b>, shortly after Euronext's prior-day close. The exact timestamp behind the data on this page is always shown under "Data as of" above the table.</div>

    <h2><span class="ico">⚠️</span>What this is not</h2>
    <div class="warn-box">Panora ranks, it doesn't decide. It's a first-pass filter meant to point research in the right direction — not investment advice, not a verified PEA-eligibility check, and not a substitute for reading the actual annual report. Always confirm eligibility with your broker before placing an order.</div>
  `;
}
function fill(id,key){
  const el=document.getElementById(id);
  [...new Set(rows.map(r=>r[key]))].filter(Boolean).sort().forEach(v=>el.add(new Option(v,v)));
}
const val=(r,k)=>k==="score"?r.scores.global:r[k];

function visible(){
  return rows.filter(r=>{
    if(st.out&&r.excluded) return false;
    if(st.half&&!r.half_price_pass) return false;
    if(st.top&&r.scores.global<SHORTLIST_SCORE) return false;
    if(st.market&&r.market!==st.market) return false;
    if(st.sector&&r.sector!==st.sector) return false;
    if(st.q&&!((r.name||"")+r.ticker).toLowerCase().includes(st.q)) return false;
    return true;
  }).sort((a,b)=>{
    const x=val(a,sortKey),y=val(b,sortKey);
    if(x==null)return 1; if(y==null)return -1;
    return (typeof x==="string"?x.localeCompare(y):x-y)*(sortAsc?1:-1);
  });
}

const scoreClass=s=>s>=4?"hi":s>=3?"mid":"lo";
/* green when the metric clears its rule of thumb, red when it doesn't */
const mark=(ok,txt)=>ok==null?`<span>${txt}</span>`:`<span class="${ok?"up":"down"}">${txt}</span>`;

function render(){
  const v=visible();
  document.getElementById("count").textContent=`${v.length} of ${rows.length} names shown`;
  document.getElementById("body").innerHTML=v.map(r=>`
   <tr data-i="${rows.indexOf(r)}" class="${r.excluded?"out":""}">
    <td><span class="tk">${r.ticker}</span><span class="nm">${r.name??""}</span></td>
    <td class="mk">${r.market??""}</td><td class="mk">${r.sector??""}</td>
    <td class="num">${eur(r.price)}</td>
    <td class="num ${sign(r.perf_52w)}">${pct(r.perf_52w,0)}</td>
    <td class="num ${sign(r.rel_strength_52w)}">${pct(r.rel_strength_52w,0)}</td>
    <td class="num">${pct(r.dist_high_52w,0)}</td>
    <td class="num">${mark(r.roe==null?null:r.roe>=(THR.min_roe??.15),pct(r.roe,0))}</td>
    <td class="num">${mark(r.roce==null?null:r.roce>=(THR.target_roce??.15),pct(r.roce,0))}</td>
    <td class="num">${mark(r.eps_growth_3y==null?null:r.eps_growth_3y>=(THR.min_eps_growth??.05),pct(r.eps_growth_3y,0))}</td>
    <td class="num">${mark(r.ev_ebitda==null?null:r.ev_ebitda<=(THR.max_ev_ebitda??10),num(r.ev_ebitda))}</td>
    <td class="num">${mark(r.peg==null?null:r.peg<=(THR.max_peg??1),num(r.peg,2))}</td>
    <td class="num">${pct(r.fcf_yield,1)}</td>
    <td class="num ${r.cagr_implied_5y>=TARGET_CAGR?"up":""}">${pct(r.cagr_implied_5y,0)}</td>
    <td><span class="score ${scoreClass(r.scores.global)}">${r.scores.global.toFixed(2)}</span></td>
    <td>${bar(r.scores)}</td>
   </tr>`).join("");
  document.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>openDrawer(rows[+tr.dataset.i]));
}
const bar=s=>`<div class="bar" data-g="bar">
  ${[["t",s.trend],["q",s.quality],["g",s.growth],["v",s.value]]
    .map(([c,n])=>`<span class="seg ${c}"><i style="height:${n*20}%"></i></span>`).join("")}</div>`;

function openDrawer(r){
  const chip=(ok,txt,gk)=>`<span class="pill ${ok?"ok":"no"}" ${gk?g(gk):""}>${ok?"✓":"✗"} ${txt}</span>`;
  const row=(gk,label,value)=>`<dt><span class="ttip" ${g(gk)}>${label}</span></dt><dd>${value}</dd>`;
  document.getElementById("drawer").innerHTML=`
   <button class="close" onclick="document.getElementById('drawer').classList.remove('open')">Close</button>
   <div class="eyebrow">${r.market} · ${r.sector} · ${r.country??""}</div>
   <h2>${r.name??r.ticker}</h2>
   <div class="num" style="color:var(--muted)">${r.ticker} · <span class="ttip" ${g("market_cap")}>${cap(r.market_cap)}</span></div>
   ${r.excluded?`<div class="reason"><b>Excluded:</b> ${r.reasons.join(" · ")}</div>`:""}

   <div class="pillhead">Priority checks — hover any pill for what it means</div>
   <div class="pills">
     ${chip((r.roe??0)>=(THR.min_roe??.15),"ROE > 15%","roe")}
     ${chip((r.roce??0)>=(THR.target_roce??.15),"ROCE > 15%","roce")}
     ${chip(r.peg!=null&&r.peg<=(THR.max_peg??1),"PEG ≤ "+(THR.max_peg??1),"peg")}
     ${chip(r.above_ma200,"Price > MA200","ma200")}
     ${chip(r.ev_ebitda!=null&&r.ev_ebitda<=(THR.max_ev_ebitda??10),"EV/EBITDA < "+(THR.max_ev_ebitda??10),"ev_ebitda")}
     ${chip((r.eps_growth_3y??0)>=(THR.min_eps_growth??.05),"EPS > "+((THR.min_eps_growth??.05)*100).toFixed(0)+"%","eps_growth_3y")}
   </div>
   <div class="pillhead">Secondary checks</div>
   <div class="pills">
     ${chip(r.above_ma50,"Price > MA50","ma50")}
     ${chip(r.ma200_slope_6m>0,"MA200 rising","ma200_slope_6m")}
     ${chip(r.half_price_pass,"Half-Price 5Y","half_price")}
     ${chip((r.insider_pct??0)>=(THR.min_insider_ownership??.03),"Insiders ≥ 3%","insider_pct")}
     ${chip(r.net_debt_ebitda!=null&&r.net_debt_ebitda<=(THR.max_debt_to_ebitda??2),"Debt/EBITDA < 2x","net_debt_ebitda")}
   </div>

   <div class="grp t"><span>📈 Trend</span><span>40% weight · ${r.scores.trend}/5</span></div>
   <dl class="kv">
     ${row("ma200","Price / MA50 / MA200",`${num(r.price,2)} / ${num(r.ma50,2)} / ${num(r.ma200,2)}`)}
     ${row("ma200_slope_6m","MA200 slope (6 months)",pct(r.ma200_slope_6m))}
     ${row("perf_52w","52-week performance",pct(r.perf_52w))}
     ${row("rel_strength_52w","Relative strength vs benchmark",pct(r.rel_strength_52w))}
     ${row("dist_high_52w","Distance from 52w high",pct(r.dist_high_52w))}
     ${row("rsi_weekly","Weekly RSI",num(r.rsi_weekly))}
     ${row("turnover_median","Median daily turnover",r.turnover_median==null?"—":cap(r.turnover_median))}
   </dl>

   <div class="grp q"><span>🏛 Quality</span><span>25% weight · ${r.scores.quality}/5</span></div>
   <dl class="kv">
     ${row("roe","ROE",pct(r.roe))}
     ${row("roce","ROCE",pct(r.roce))}
     ${row("net_margin","Net margin",pct(r.net_margin))}
     ${row("net_debt_ebitda","Net debt / EBITDA",num(r.net_debt_ebitda,2)+"x")}
     ${row("net_debt_net_income","Net debt / net income",num(r.net_debt_net_income,2)+"x")}
     ${row("current_ratio","Current ratio",num(r.current_ratio,2))}
     ${row("insider_pct","Insider ownership",pct(r.insider_pct))}
   </dl>

   <div class="grp g"><span>🌱 Growth</span><span>20% weight · ${r.scores.growth}/5</span></div>
   <dl class="kv">
     ${row("rev_growth_3y","Revenue growth (3y)",pct(r.rev_growth_3y))}
     ${row("eps_growth_3y","EPS growth (3y)",pct(r.eps_growth_3y))}
   </dl>

   <div class="grp v"><span>🏷 Value</span><span>15% weight · ${r.scores.value}/5</span></div>
   <dl class="kv">
     ${row("pe","P/E",num(r.pe))}
     ${row("peg","PEG",num(r.peg,2))}
     ${row("ev_ebitda","EV/EBITDA",num(r.ev_ebitda))}
     ${row("fcf_yield","FCF yield",pct(r.fcf_yield))}
     ${row("dividend_yield","Dividend yield",pct(r.dividend_yield))}
     ${row("half_price","Projected 5y value",eur(r.fair_value_5y))}
     ${row("cagr_implied_5y","Implied 5y CAGR",pct(r.cagr_implied_5y))}
   </dl>`;
  document.getElementById("drawer").classList.add("open");
}

document.getElementById("head").onclick=e=>{
  const th=e.target.closest("th[data-k]"); if(!th) return;
  const k=th.dataset.k;
  sortAsc = (k===sortKey)? !sortAsc : (k==="ticker"||k==="market"||k==="sector");
  sortKey=k;
  document.querySelectorAll("thead th").forEach(x=>x.removeAttribute("aria-sort"));
  th.setAttribute("aria-sort",sortAsc?"asc":"desc");
  render();
};
const tog=(id,key)=>document.getElementById(id).onclick=e=>{st[key]=!st[key];e.currentTarget.classList.toggle("on",st[key]);render()};
tog("fOut","out"); tog("fHalf","half"); tog("fTop","top");
["market","sector"].forEach(k=>document.getElementById(k).onchange=e=>{st[k]=e.target.value;render()});
document.getElementById("q").oninput=e=>{st.q=e.target.value.toLowerCase();render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("drawer").classList.remove("open");hideTip()}});

function switchTab(name){
  const isScreener = name==="screener";
  document.getElementById("tabScreener").classList.toggle("active", isScreener);
  document.getElementById("tabMethod").classList.toggle("active", !isScreener);
  document.getElementById("viewScreener").style.display = isScreener ? "" : "none";
  document.getElementById("viewMethod").style.display = isScreener ? "none" : "";
}
document.getElementById("tabScreener").onclick=()=>switchTab("screener");
document.getElementById("tabMethod").onclick=()=>switchTab("methodology");


document.getElementById("csv").onclick=()=>{
  const v=visible(), cols=["ticker","name","market","sector","price","perf_52w","rel_strength_52w","roe","roce","ev_ebitda","peg","fcf_yield","pe","net_debt_ebitda","eps_growth_3y","cagr_implied_5y"];
  const csv=[[...cols,"score"].join(","),
    ...v.map(r=>[...cols.map(c=>`"${String(r[c]??"").replace(/"/g,'""')}"`),r.scores.global].join(","))].join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="panora-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
};
document.getElementById("brief").onclick=async e=>{
  const v=visible().slice(0,12);
  const txt=["FUNDAMENTAL RESEARCH BRIEF",
    "Style: trend-following PEA screen on Euronext · data as of "+new Date(DATA.generated_at).toLocaleDateString("en-US"),"",
    ...v.map(r=>`${r.ticker} — ${r.name} (${r.market}, ${r.sector}) | score ${r.scores.global} `+
      `| 52w perf ${pct(r.perf_52w,0)} | ROE ${pct(r.roe,0)} | ROCE ${pct(r.roce,0)} `+
      `| EV/EBITDA ${num(r.ev_ebitda)} | PEG ${num(r.peg,2)} `+
      `| 5y CAGR ${pct(r.cagr_implied_5y,0)}${r.half_price_pass?" (Half-Price passed)":""}`),
    "","For each name, check: PEA eligibility (EU/EEA headquarters), organic vs. acquired growth,",
    "moat durability >= 5 years, debt sustainability, governance and insider ownership."].join("\n");
  try{await navigator.clipboard.writeText(txt); e.currentTarget.textContent="✓ Brief copied"; }
  catch{ e.currentTarget.textContent="Clipboard access denied"; }
  setTimeout(()=>e.currentTarget.textContent="📋 Copy research brief",2200);
};
</script>
</body>
</html>
