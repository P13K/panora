name: Refresh screener

on:
  schedule:
    - cron: "30 5 * * 2-6"   # Tue-Sat, 05:30 UTC (after Euronext's prior-day close)
  workflow_dispatch:          # "Run workflow" button for on-demand runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the Euronext universe
        run: python build_universe.py

      - name: Run the screener
        run: python screener.py

      - name: Archive today's universe
        uses: actions/upload-artifact@v4
        with:
          name: universe
          path: universe.csv
          retention-days: 30

      - name: Prepare the site
        run: |
          mkdir -p _site
          cp index.html data.json config.json _site/
          cp data.demo.json _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
